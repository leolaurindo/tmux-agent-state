# Source this file after the theme. Configure styles after this line.
# hax emits BEL when an interactive turn becomes idle; keep that event silent
# and use it only for the hax window's status styling.
set -g monitor-bell on
set -g bell-action none
set -g visual-bell off
set -g @hax_idle_style '#{E:@agent_idle_style}'

run-shell -b 'bash "#{q:#{d:current_file}}/hax-agent-hook.sh" "#{q:#{d:current_file}}/hax-agent-bell.sh"'
run-shell 'bash "#{q:#{d:current_file}}/hax-agent-state.sh"'
