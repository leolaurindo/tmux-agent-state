# Source this file from ~/.tmux.conf.
# Change these two values before sourcing if desired.
set -g @agent_accent "colour39"
set -g @agent_highlight_when "running"

# @agent_window limits highlighting to windows that loaded an extension.
# The conditional style is applied only to the window name.
set -g window-status-format '#I:#{?@agent_window,#{?#{==:#{@agent_highlight_when},idle},#{?@agent_running,,#[fg=#{@agent_accent}]},#{?@agent_running,#[fg=#{@agent_accent}],}},}#W'
set -g window-status-current-format '#I:#{?@agent_window,#{?#{==:#{@agent_highlight_when},idle},#{?@agent_running,,#[fg=#{@agent_accent}]},#{?@agent_running,#[fg=#{@agent_accent}],}},}#W'
